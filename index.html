        <h1>radiology.monster — Real cases. Deeper understanding.</h1>
        <p>radiology.monster needs JavaScript and WebGL. It is a radiology reading workstation for medical students and residents: real CT, MRI, X-ray, mammography and ultrasound, graded on the exact slice against the expert reference, with certification exams in three levels that get much harder: 15, 25 and 40 questions, pass marks 70, 80 and 90%.</p>
        <dl>
        <dt>What is radiology.monster?</dt>
        <dd>A radiology reading workstation in the browser for medical students and residents: real CT, MRI, X-ray, mammography and ultrasound studies, where you scroll the whole study, mark what you see and are graded against the expert reference on the exact slice, with each task linked to the page of Learning Radiology (5th ed.) that explains it.</dd>
        <dt>Who marked the findings and the anatomy?</dt>
        <dd>Findings are outlined by the radiologists and experts who published each collection, and only those expert outlines grade answers. The anatomy layer (organs, vessels, bones and airways named on every scan) is drawn by AI and labelled AI wherever it appears. Thanks to Horalix.com, every structure in it is marked.</dd>
        <dt>How do I earn a certificate?</dt>
        <dd>Pass an exam. The levels go in order, and each is a real step up: Foundation has 15 untimed questions with a pass mark of 70%; Intermediate 25 questions at 3 minutes each, 80%, at least half marked on the image; Advanced 40 questions at 2 minutes each, 90% with no half points, mostly marked on the image, subtle cases first. Each question shows a real patient and is graded against the expert reference, with no hints; the result comes after the last question. A passed exam gives a certificate with its own check page that can be added to LinkedIn under Licenses &amp; certifications.</dd>
        <dt>Where do the scans come from?</dt>
        <dd>From public research collections released for reuse, including commercial use (Creative Commons and NIH terms). They are de-identified, and every case names its source and licence.</dd>
        <dt>Can I use it to diagnose patients?</dt>
        <dd>No. radiology.monster is for education and practice only. It is not a medical device and must not be used for clinical decisions.</dd>
        </dl>
        <p>Anatomy outlines: AI. <a href="https://horalix.com">Thanks to Horalix.com</a>, we managed to mark every structure in the anatomy layer.</p>
