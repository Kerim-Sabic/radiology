      <main>
        <h1>Radiology Monster: real radiology cases for medical students and residents</h1>
        <p>Radiology Monster (radiology.monster) needs JavaScript and WebGL. It is a radiology reading workstation in the browser: real CT, MRI, X-ray, mammography and ultrasound from 600+ de-identified patients, where you mark what you see and are graded against the expert reference on the exact slice. A free account opens two sample patients, with no card.</p>
        <dl>
        <dt>What is Radiology Monster?</dt>
        <dd>Radiology Monster (radiology.monster) is a radiology reading workstation in the browser for medical students and residents: real CT, MRI, X-ray, mammography and ultrasound studies, where you scroll the whole study, mark what you see and are graded against the expert reference on the exact slice, with each task linked to the page of Learning Radiology (5th ed.) that explains it.</dd>
        <dt>How much does it cost?</dt>
        <dd>A free account opens two sample patients in the full workstation, with grading and no card. Membership is $20 every 30 days or $150 every 365 days (equal to $12.50 a month); an eligible university email gets 30% off: $14 every 30 days or $105 every 365 days.</dd>
        <dt>Can professors use it with a class?</dt>
        <dd>Yes. A professor gets a class page with one join link to share. Students join after seeing what the professor can follow: their study days, exam results and certificates, never their answers or payments.</dd>
        <dt>Who marked the findings and the anatomy?</dt>
        <dd>Findings come from the reference annotations published with each collection, made by its radiologists and clinicians or under their supervision, and only those references grade answers. Each case names its source. The anatomy layer (organs, vessels, bones and airways named on every scan) is drawn by AI and labelled AI wherever it appears. Thanks to Horalix.com, every structure in it is marked.</dd>
        <dt>How do I earn a certificate?</dt>
        <dd>Pass an exam. The levels go in order, and each is a real step up: Foundation has 15 untimed questions with a pass mark of 70%; Intermediate 25 questions at 3 minutes each, 80%, at least half marked on the image; Advanced 40 questions at 2 minutes each, 90% with no half points, mostly marked on the image, subtle cases first. Each question shows a real patient and is graded against the expert reference, with no hints; the result comes after the last question. A passed exam gives a certificate with its own check page that can be added to LinkedIn under Licenses &amp; certifications.</dd>
        <dt>Where do the scans come from?</dt>
        <dd>From public research collections released for reuse, including commercial use (Creative Commons and NIH terms). They are de-identified, and every case names its source and licence.</dd>
        <dt>Where is my progress kept?</dt>
        <dd>In your account. Every answer you submit is saved there with its grade, so your answers, scores and mistake notebook follow you to any device where you sign in. Your browser keeps a copy too, so nothing is lost if the connection drops.</dd>
        <dt>Can I use it to diagnose patients?</dt>
        <dd>No. Radiology Monster is for education and practice only. It is not a medical device and must not be used for clinical decisions.</dd>
        </dl>
        <p><a href="https://www.radiology.monster/verify/example">See an example certificate</a> · <a href="/llms.txt">Radiology Monster for language models</a></p>
        <p>Anatomy outlines: AI. <a href="https://horalix.com">Thanks to Horalix.com</a>, we managed to mark every structure in the anatomy layer.</p>
