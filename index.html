    <!-- Loading and error screens: a CT slice in a viewer frame. Styled here, not in app.css, so they show before any
         JavaScript or stylesheet has loaded. The React versions are in src/components/ScanState.tsx; keep them in step. -->
    <style>
      html,body,#root{height:100%;margin:0}
      body{background:#000}
      .rs{box-sizing:border-box;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:32px 20px;background:#000;color:#aeaeb2;font:15px/1.47 -apple-system,BlinkMacSystemFont,'Inter Variable','Inter','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;text-align:center;-webkit-font-smoothing:antialiased}
      .rs *{box-sizing:border-box}
      .rs [hidden]{display:none!important}
      .rs-view{position:relative;flex:none;width:min(360px,82vw);aspect-ratio:4/3;background:#000;overflow:hidden}
      .rs-compact .rs-view{width:min(260px,66vw)}
      /* A CT gantry: the tube and the detector arc rotate around the patient; the slice is rebuilt behind the beam,
         one real slice per rotation while the table moves: the last slice stays underneath and the next is painted over

         at once, offline and from file://; regenerate with scripts/make_loader_ct.py. */

    <script>
      // Until the app has drawn, a failed download of its code or a crash while it starts would leave a black page.
      // Show the reading-room error screen instead, with the message and a reload. Once React draws, #rvm-boot is gone
      // and this does nothing (the app's own boundaries take over). Only our own code counts: an ad blocker stopping a
      // tracker or analytics must not look like a failure.
      (function () {
        var ours = new RegExp('^' + location.origin.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '/(assets|src|@vite|node_modules)/');
        function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
        function whenReady(fn) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fn); else fn(); }
        function fail(message) {
          whenReady(function () {
            var boot = document.getElementById('rvm-boot');
            var root = document.getElementById('root');
            if (!boot || !root) return;
            var offline = navigator.onLine === false;
            var scan = boot.querySelector('.rs-scan');
            window.__rvmBootDetails = message + '\nPage: ' + location.pathname + '\nTime: ' + new Date().toISOString() + '\nBrowser: ' + navigator.userAgent;
            root.innerHTML =
              '<div class="rs rs-error" role="alert"><div class="rs-view">' + (scan ? scan.outerHTML : '') +
              '<div class="rs-noise" aria-hidden="true"></div><div class="rs-flag" aria-hidden="true">' + (offline ? 'No signal' : 'Series incomplete') + '</div>' +
              '<div class="rs-ov rs-tl" aria-hidden="true">RADIOLOGY MONSTER<br>STUDY UNAVAILABLE</div><div class="rs-ov rs-tr" aria-hidden="true">IM —/—</div>' +
              '<div class="rs-ov rs-bl" aria-hidden="true">W — L —</div><div class="rs-ov rs-br" aria-hidden="true">' + (offline ? 'OFFLINE' : 'ERR') + '</div></div>' +
              '<h1>' + (offline ? 'You seem to be offline' : 'Radiology Monster didn’t finish loading') + '</h1>' +
              '<p>' + (offline ? 'Check your connection, then reload.' : 'Part of the app failed to download or start. Reload to try again; if it keeps happening, copy the details and send them to us.') + '</p>' +
              '<div class="rs-actions"><button type="button" class="rs-btn primary" onclick="location.reload()">Reload</button><a class="rs-btn" href="/">Go to Today</a>' +
              '<button type="button" class="rs-btn" onclick="navigator.clipboard&&navigator.clipboard.writeText(window.__rvmBootDetails).then(function(){this.textContent=\'Copied\'}.bind(this))">Copy details</button></div>' +
              '<pre class="rs-detail" aria-label="Error message">' + esc(message) + '</pre><p class="rs-credit">Real CT · LCTSC (TCIA), CC BY 3.0</p></div>';
          });
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t !== window && t.tagName) {
            var src = t.src || t.href || '';
            if ((t.tagName === 'SCRIPT' || t.tagName === 'LINK') && ours.test(src)) fail('Could not download ' + src.slice(location.origin.length).split('?')[0]);
            return;
          }
          if (e.filename && ours.test(e.filename)) fail((e.error && e.error.name ? e.error.name : 'Error') + ': ' + e.message);
        }, true);
        window.addEventListener('unhandledrejection', function (e) {
          var r = e.reason, m = r && r.message ? r.message : String(r);
          if (/dynamically imported module|Importing a module script failed|error loading dynamically/i.test(m)) fail(m);
        });
      })();
    </script>
