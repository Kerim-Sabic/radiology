# Netlify: static SPA (no server functions).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Missing data files must be real 404s, never the SPA shell.
[[redirects]]
  from = "/packs/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/content/*"
  to = "/404.html"
  status = 404

# SPA deep links (only applies when no real file matches the path).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# DICOM files are content-addressed (hash-prefixed names), so they can be cached forever.
[[headers]]
  for = "/packs/*/dicom/*"
  [headers.values]
    Content-Type = "application/dicom"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/packs/*.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"
